<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===== GREETING SECTION ===== -->
  <header class="greeting-section">
    <div class="greeting-inner">
      <p id="current-date" class="date-display"></p>
      <h1 id="greeting-text" class="greeting-text"></h1>
      <p id="current-time" class="time-display"></p>
    </div>
  </header>

  <!-- ===== MAIN DASHBOARD ===== -->
  <main class="dashboard">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card timer-card" aria-label="Focus Timer">
      <h2 class="card-title">Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="timer-start">Start</button>
        <button class="btn btn-secondary" id="timer-stop">Stop</button>
        <button class="btn btn-ghost" id="timer-reset">Reset</button>
      </div>
      <p class="timer-label" id="timer-label">Ready to focus?</p>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card todo-card" aria-label="To-Do List">
      <h2 class="card-title">To-Do List</h2>

      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          class="text-input"
          placeholder="Add a new task..."
          maxlength="120"
          aria-label="New task input"
        />
        <button class="btn btn-primary" id="todo-add">Add</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Task list">
        <!-- Tasks injected by JS -->
      </ul>

      <p class="todo-empty" id="todo-empty">No tasks yet. Add one above!</p>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card links-card" aria-label="Quick Links">
      <h2 class="card-title">Quick Links</h2>

      <div class="links-input-row">
        <input
          type="text"
          id="link-name-input"
          class="text-input"
          placeholder="Link name"
          maxlength="30"
          aria-label="Link name"
        />
        <input
          type="url"
          id="link-url-input"
          class="text-input"
          placeholder="https://example.com"
          aria-label="Link URL"
        />
        <button class="btn btn-primary" id="link-add">Add</button>
      </div>

      <div id="links-grid" class="links-grid">
        <!-- Link buttons injected by JS -->
      </div>

      <p class="todo-empty" id="links-empty">No links yet. Add your favorites!</p>
    </section>

  </main>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <h3 id="modal-title" class="modal-title">Edit Task</h3>
      <input
        type="text"
        id="edit-input"
        class="text-input"
        maxlength="120"
        aria-label="Edit task text"
      />
      <div class="modal-actions">
        <button class="btn btn-primary" id="edit-save">Save</button>
        <button class="btn btn-ghost" id="edit-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===== EDIT LINK MODAL ===== -->
  <div id="edit-link-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="link-modal-title" hidden>
    <div class="modal-box">
      <h3 id="link-modal-title" class="modal-title">Edit Link</h3>
      <input
        type="text"
        id="edit-link-name"
        class="text-input"
        placeholder="Link name"
        maxlength="30"
        aria-label="Edit link name"
      />
      <input
        type="url"
        id="edit-link-url"
        class="text-input"
        placeholder="https://example.com"
        aria-label="Edit link URL"
      />
      <div class="modal-actions">
        <button class="btn btn-primary" id="edit-link-save">Save</button>
        <button class="btn btn-ghost" id="edit-link-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
